replicaCount: 1

image:
  repository: emilioya/rag-api
  pullPolicy: Always
  tag: "v1.1"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rag-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

env:
  qdrantHost: qdrant
  qdrantPort: 6333

secrets:
  geminiApiKey: ""

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
