name: Deploy Backend to EC2

on:
  push:
    branches:
      - Main
    paths:
      - 'backend/**'
      - '!backend/helm/**'  # Helm changes use separate workflow
  workflow_dispatch:  # Manual trigger

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/rag-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend  # ← Backend code is in backend/ folder
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image build summary
        run: |
          echo " Docker image built and pushed!"
          echo " Image: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2 with Helm
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            # Update Helm deployment with new image
            cd ~/backend/helm/rag-api  # ← Helm chart is in backend/helm/
            
            # Upgrade with new image tag
            helm upgrade rag-api . \
              --namespace rag-api \
              --set image.tag=${{ env.IMAGE_TAG }} \
              --set secrets.geminiApiKey='${{ secrets.GEMINI_API_KEY }}' \
              --reuse-values
            
            # Wait for rollout
            kubectl rollout status deployment/rag-api -n rag-api --timeout=5m
            
            echo " Deployment successful!"
          EOF
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            kubectl get pods -n rag-api
            kubectl get svc -n rag-api
          EOF
      
      - name: Deployment summary
        run: |
          echo " Backend deployed successfully!"
          echo " Image: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo " API URL: http://${{ secrets.EC2_HOST }}:8000"